name: Build

on:
  pull_request:
    branches:
      - feature/final-product-schema
  push:
    branches:
      - integration/product-schema-public-finance

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Synchronize frontend lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  backend:
    name: Backend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: .
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Build backend
        run: npm run build
