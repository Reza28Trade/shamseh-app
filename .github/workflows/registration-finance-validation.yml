name: Registration finance validation

on:
  pull_request:
    branches:
      - integration/product-schema-public-finance
    paths:
      - "backend/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/registration-finance-validation.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shamseh_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shamseh_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shamseh_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Verify one-open-registration database constraint
        run: psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -tAc "SELECT to_regclass('public.\"Registration_one_open_per_nationalId_key\"') IS NOT NULL" | grep -qx t
      - run: npm run test:registration-finance-rules

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
